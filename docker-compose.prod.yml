version: '3.8'

services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - personal-website-network

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://personal_website_user:${DB_PASSWORD}@postgres:5432/personal_website
      - STRAPI_URL=http://cms:1337
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_PATH=/app/uploads
      - STORAGE_LOCAL_URL=https://yourdomain.com/files
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      cms:
        condition: service_started
    networks:
      - personal-website-network

  cms:
    build:
      context: ./packages/cms
      dockerfile: Dockerfile.prod
    volumes:
      - strapi_uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=personal_website
      - DATABASE_USERNAME=personal_website_user
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_SSL=false
      - DATABASE_SCHEMA=strapi
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - APP_KEYS=${APP_KEYS}
      - STRAPI_ADMIN_BACKEND_URL=https://yourdomain.com
      - STRAPI_ADMIN_CLIENT_URL=https://yourdomain.com
      - STRAPI_ADMIN_CLIENT_PREVIEW_SECRET=${STRAPI_ADMIN_CLIENT_PREVIEW_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personal-website-network

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./deployment/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_DB=personal_website
      - POSTGRES_USER=personal_website_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_website_user -d personal_website"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - personal-website-network

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf
      - ./deployment/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - api
      - cms
    networks:
      - personal-website-network

volumes:
  postgres_data_prod:
  uploads_data:
  strapi_uploads:

networks:
  personal-website-network:
    driver: bridge